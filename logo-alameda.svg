<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="Floristería Alameda">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&amp;family=Montserrat:wght@400;500&amp;display=swap');
    </style>
  </defs>

  <!-- Fondo blanco -->
  <rect width="560" height="320" fill="#ffffff"/>

  <!-- Marco doble exterior (estética artesanal premium) -->
  <rect x="7"  y="7"  width="546" height="306" fill="none" stroke="#3a5244" stroke-width="1.6"/>
  <rect x="13" y="13" width="534" height="294" fill="none" stroke="#3a5244" stroke-width="0.5" opacity="0.45"/>

  <!-- ══════════════════════════════════
       ILUSTRACIÓN BOTÁNICA
       Centro en (280, 112)
  ══════════════════════════════════ -->
  <g transform="translate(280,112)">

    <!-- Tallo principal -->
    <path d="M0 48 C0 35 0 20 0 6" stroke="#3a5244" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Hoja izquierda baja (grande) -->
    <path d="M0 38 C-12 30 -26 20 -30 10 C-32 4 -26 -1 -18 4 C-10 9 -2 22 0 38"
          fill="#3a5244"/>

    <!-- Hoja derecha media -->
    <path d="M0 26 C12 18 26 8 30 -2 C32 -8 26 -13 18 -8 C10 -3 2 10 0 26"
          fill="#3a5244"/>

    <!-- Hojita izquierda alta -->
    <path d="M0 14 C-9 6 -18 -2 -16 -10 C-15 -15 -8 -13 -4 -7 C-1 -3 0 4 0 14"
          fill="#3a5244" opacity="0.72"/>

    <!-- 5 pétalos (forma de gota redondeada) -->
    <path d="M0 0 C-6 -4 -6.5 -16 0 -23 C6.5 -16 6 -4 0 0" fill="#c4908a" transform="rotate(0)"/>
    <path d="M0 0 C-6 -4 -6.5 -16 0 -23 C6.5 -16 6 -4 0 0" fill="#c4908a" transform="rotate(72)"/>
    <path d="M0 0 C-6 -4 -6.5 -16 0 -23 C6.5 -16 6 -4 0 0" fill="#c4908a" transform="rotate(144)"/>
    <path d="M0 0 C-6 -4 -6.5 -16 0 -23 C6.5 -16 6 -4 0 0" fill="#c4908a" transform="rotate(216)"/>
    <path d="M0 0 C-6 -4 -6.5 -16 0 -23 C6.5 -16 6 -4 0 0" fill="#c4908a" transform="rotate(288)"/>

    <!-- Sépalos verdes entre pétalos (detalle de calidad) -->
    <path d="M0 0 C-2.5 -2 -3 -10 0 -14 C3 -10 2.5 -2 0 0" fill="#3a5244" opacity="0.6" transform="rotate(36)"/>
    <path d="M0 0 C-2.5 -2 -3 -10 0 -14 C3 -10 2.5 -2 0 0" fill="#3a5244" opacity="0.6" transform="rotate(108)"/>
    <path d="M0 0 C-2.5 -2 -3 -10 0 -14 C3 -10 2.5 -2 0 0" fill="#3a5244" opacity="0.6" transform="rotate(180)"/>
    <path d="M0 0 C-2.5 -2 -3 -10 0 -14 C3 -10 2.5 -2 0 0" fill="#3a5244" opacity="0.6" transform="rotate(252)"/>
    <path d="M0 0 C-2.5 -2 -3 -10 0 -14 C3 -10 2.5 -2 0 0" fill="#3a5244" opacity="0.6" transform="rotate(324)"/>

    <!-- Círculo central oscuro -->
    <circle r="7.5" fill="#3a5244"/>
    <!-- Punto dorado central -->
    <circle r="3.5" fill="#b8914a"/>
  </g>

  <!-- ══════════════════════════════════
       SEPARADOR DECORATIVO
  ══════════════════════════════════ -->
  <!-- Línea izquierda -->
  <line x1="36" y1="164" x2="228" y2="164" stroke="#3a5244" stroke-width="0.9" opacity="0.38"/>
  <!-- Diamante izquierdo -->
  <path d="M232 164 L237 159 L242 164 L237 169 Z" fill="#b8914a"/>
  <!-- Diamante derecho -->
  <path d="M318 164 L323 159 L328 164 L323 169 Z" fill="#b8914a"/>
  <!-- Línea derecha -->
  <line x1="332" y1="164" x2="524" y2="164" stroke="#3a5244" stroke-width="0.9" opacity="0.38"/>

  <!-- ══════════════════════════════════
       TIPOGRAFÍA
  ══════════════════════════════════ -->

  <!-- FLORISTERÍA — espaciado amplio, Montserrat -->
  <text
    x="280" y="193"
    text-anchor="middle"
    font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
    font-size="12.5"
    font-weight="500"
    fill="#3a5244"
    letter-spacing="7.5">FLORISTERÍA</text>

  <!-- ALAMEDA — serif elegante, peso fuerte -->
  <text
    x="280" y="256"
    text-anchor="middle"
    font-family="'Playfair Display', 'Times New Roman', Georgia, serif"
    font-size="62"
    font-weight="600"
    fill="#3a5244"
    letter-spacing="5">ALAMEDA</text>

  <!-- Línea fina bajo ALAMEDA -->
  <line x1="95" y1="267" x2="465" y2="267" stroke="#3a5244" stroke-width="0.65" opacity="0.3"/>

  <!-- · CARTAGENA · — subtítulo discreto -->
  <text
    x="280" y="289"
    text-anchor="middle"
    font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
    font-size="10"
    font-weight="400"
    fill="#3a5244"
    letter-spacing="5.5"
    opacity="0.6">· CARTAGENA ·</text>
</svg>
