<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Floristería Alameda · Cerrado Temporalmente</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://floristeriaalameda.com/favicon-32.png?v=2"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  width:100%;
  font-family:'Helvetica Neue',Arial,sans-serif;
}
body{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  overflow:hidden;
}

/* Foto de fondo a pantalla completa */
.bg{
  position:fixed;
  inset:0;
  background-image:url('local-floristeria.jpg');
  background-size:cover;
  background-position:center 30%;
  background-repeat:no-repeat;
  z-index:0;
}

/* Capa oscura para legibilidad */
.overlay{
  position:fixed;
  inset:0;
  background:linear-gradient(
    160deg,
    rgba(30,42,31,0.72) 0%,
    rgba(44,60,46,0.78) 50%,
    rgba(20,30,21,0.82) 100%
  );
  z-index:1;
}

/* Contenido centrado */
.content{
  position:relative;
  z-index:2;
  text-align:center;
  color:#fff;
  padding:32px 24px;
  max-width:600px;
  width:100%;
}

/* Logo circular */
.logo-ring{
  width:96px;height:96px;border-radius:50%;
  border:3px solid rgba(255,255,255,0.25);
  overflow:hidden;margin:0 auto 28px;
}
.logo-ring img{
  width:100%;height:100%;object-fit:cover;display:block;
}

/* Marca */
.brand-sup{
  font-size:10px;letter-spacing:.25em;text-transform:uppercase;
  color:#a5c1a7;font-weight:600;margin-bottom:6px;
}
.brand-name{
  font-size:36px;font-weight:800;letter-spacing:.08em;
  font-family:Georgia,serif;color:#fff;margin-bottom:4px;
}
.brand-city{
  font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.5);
  margin-bottom:40px;
}

/* Divisor */
.line{
  width:52px;height:2px;border-radius:9999px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  margin:0 auto 40px;
}

/* Mensaje principal */
h1{
  font-size:clamp(28px,5vw,44px);
  font-family:Georgia,serif;
  font-weight:700;
  color:#fff;
  line-height:1.25;
  margin-bottom:18px;
  letter-spacing:-.3px;
}
.sub{
  font-size:clamp(15px,2.5vw,18px);
  color:rgba(255,255,255,.75);
  line-height:1.7;
  margin-bottom:48px;
  font-weight:400;
}

/* Botón WhatsApp */
.wa-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:#25D366;
  color:#fff;
  border-radius:9999px;
  padding:16px 40px;
  text-decoration:none;
  font-size:16px;
  font-weight:700;
  letter-spacing:.02em;
  box-shadow:0 8px 28px rgba(37,211,102,.35);
  transition:transform .15s,box-shadow .15s;
  margin-bottom:40px;
}
.wa-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 36px rgba(37,211,102,.45);
}
.wa-btn:active{transform:scale(.97);}

/* Info inferior */
.info{
  font-size:13px;
  color:rgba(255,255,255,.45);
  line-height:2;
  letter-spacing:.02em;
}
.info a{
  color:rgba(255,255,255,.6);
  text-decoration:none;
  font-weight:600;
}

@media(max-width:480px){
  .brand-name{font-size:28px;}
  .wa-btn{padding:15px 32px;font-size:15px;width:100%;max-width:320px;}
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="content">

  <div class="logo-ring">
    <img src="logo-floristeria.jpg" alt="Floristería Alameda" width="96" height="96"/>
  </div>

  <p class="brand-sup">Floristería</p>
  <p class="brand-name">ALAMEDA</p>
  <p class="brand-city">· CARTAGENA ·</p>

  <div class="line"></div>

  <h1>Cerrado temporalmente<br>por vacaciones</h1>
  <p class="sub">
    Volveremos pronto con todas las flores.<br>
    Hasta nuevo aviso — ¡gracias por tu comprensión! 🌿
  </p>

  <a href="https://wa.me/34627546360?text=Hola%2C%20he%20visto%20que%20estáis%20de%20vacaciones.%20¿Cuándo%20reabríais%3F"
     class="wa-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 0C5.373 0 0 5.373 0 12a11.94 11.94 0 001.664 6.1L.06 23.4l5.42-1.578A11.94 11.94 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0z" fill="white"/>
      <path d="M17.675 15.353c-.275-.138-1.631-.805-1.884-.896-.253-.092-.437-.138-.62.138-.184.276-.71.896-.87 1.08-.16.185-.32.207-.594.07-.276-.138-1.163-.428-2.217-1.37-.82-.73-1.374-1.633-1.535-1.909-.16-.276-.017-.425.12-.562.122-.122.276-.318.413-.477.138-.16.184-.276.276-.46.092-.184.046-.345-.023-.483-.07-.138-.62-1.492-.849-2.044-.223-.537-.45-.463-.62-.47l-.527-.01c-.184 0-.483.07-.736.345-.253.276-.96.938-.96 2.29 0 1.35.983 2.656 1.12 2.84.138.184 1.934 2.952 4.687 4.14.655.284 1.165.452 1.563.578.657.209 1.256.18 1.729.109.527-.079 1.62-.663 1.849-1.303.23-.64.23-1.188.16-1.303-.069-.115-.253-.184-.527-.322z" fill="#25D366"/>
    </svg>
    Escríbenos por WhatsApp
  </a>

  <p class="info">
    📍 Alameda de San Antón, 15 · Cartagena, Murcia<br>
    <a href="tel:627546360">627 54 63 60</a>
    &nbsp;·&nbsp;
    <a href="https://floristeriaalameda.com">floristeriaalameda.com</a>
  </p>

</div>

</body>
</html>
